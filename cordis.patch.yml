# 挂载 dsh-link-menu。Mounts the plugin into a DSH profile.
#
# workspaceRoot 可选：设置后，消息里的相对文件引用（如 `src/main.ts`）会优先按它解析。
# 不设置时依次尝试 DSH 的所有工作区目录、工作目录默认值、Host 进程当前目录。
# workspaceRoot is optional; when omitted, every known DSH workspace is tried first.
- insert:
    - id: link-menu
      name: dsh-link-menu
      # config:
      #   workspaceRoot: 'C:\Users\me\Documents\my-workspace'
